  },
  borrarAviso(S,d){ const a=S.avisos.find(x=>x.id===d.id); if(!a) falla('Aviso no encontrado'); if(a.personaId!==S.yo.id && !puedeEn(S,'avisos')) falla('Solo el administrador o el moderador pueden borrar avisos de otros'); S.avisos=S.avisos.filter(x=>x.id!==d.id); },
  fijarAviso(S,d){ if(!puedeEn(S,'avisos')) falla('Solo el administrador o el moderador pueden fijar avisos'); const a=S.avisos.find(x=>x.id===d.id); if(!a) falla('Aviso no encontrado'); a.fijado=!!d.fijar; },
  guardarArticulo(S,d){
    if(!puedeEn(S,'eventos')) falla('No tienes permiso para crear artículos');
    const desc=String(d.descripcion||'').trim(); if(!desc) falla('Escribe qué hay que llevar');
    const cantidad=Math.max(0,r2(d.cantidad));
    if(d.id){
      const {a}=buscarArt(S,d.id); if(!a) falla('Artículo no encontrado');
      a.descripcion=desc; a.cantidad=cantidad;
      if(d.paraTodos){ a.paraTodos=true; a.personaId=''; } else if(d.personas&&d.personas.length===1){ a.paraTodos=false; a.personaId=d.personas[0]; }
      return;
    }
    const ev=evAprobadoDe(S,d.eventoId), dest=d.paraTodos?['*']:(d.personas||[]);
    if(!dest.length) falla('Elige a quién le toca llevarlo');
    dest.forEach((pid,i)=>ev.articulos.push({id:d.cids[i],paraTodos:pid==='*',personaId:pid==='*'?'':pid,descripcion:desc,cantidad,entregados:[],porConfirmar:[],avance:{},movs:[]}));
  },
  borrarArticulo(S,d){ if(!puedeEn(S,'eventos')) falla('No tienes permiso'); S.eventos.forEach(ev=>ev.articulos=(ev.articulos||[]).filter(a=>a.id!==d.id)); },
  marcarEntrega(S,d){
    const {a}=buscarArt(S,d.id); if(!a) falla('Artículo no encontrado');
    const g=puedeEn(S,'articulos'), pid=d.personaId||S.yo.id;
    if(!g && pid!==S.yo.id) falla('Solo puedes marcar tus propios artículos');
    if(!a.asignados.includes(pid)) falla('Este artículo no está asignado a esa persona');
    if(!g && a.entregados.includes(pid)) falla('El administrador ya lo confirmó como entregado');
    a.entregados=a.entregados.filter(x=>x!==pid); a.porConfirmar=a.porConfirmar.filter(x=>x!==pid);
    if(d.entregado) (g?a.entregados:a.porConfirmar).push(pid);
  },
  confirmarEntrega(S,d){
    if(!puedeEn(S,'articulos')) falla('No tienes permiso para confirmar artículos');
    const {a}=buscarArt(S,d.id); if(!a) falla('Artículo no encontrado');
    a.entregados=a.entregados.filter(x=>x!==d.personaId); a.porConfirmar=a.porConfirmar.filter(x=>x!==d.personaId);
    if(d.aprobar) a.entregados.push(d.personaId);
  },
  registrarEntrega(S,d,op){
    const {a}=buscarArt(S,d.articuloId); if(!a) falla('Artículo no encontrado'); if(!(a.cantidad>0)) falla('Este artículo no lleva cantidad');
    const g=puedeEn(S,'articulos'), pid=g&&d.personaId?d.personaId:S.yo.id;
    if(!a.asignados.includes(pid)) falla('Este artículo no está asignado a esa persona');
    const cant=r2(d.cantidad); if(!(cant>0)) falla('Escribe cuántos entregas');
    const llevado=sumaM(a.movs.filter(x=>x.personaId===pid&&x.estado!=='rechazado'),'cantidad'), falta=r2(a.cantidad-llevado);
    if(cant>falta+0.0001) falla(falta>0?'Solo faltan '+falta:'Ya está completo');
    a.movs.unshift({id:d.cid,personaId:pid,nombre:nombreEn(S,pid),cantidad:cant,estado:g?'validado':'pendiente',fecha:op.t});
  },
  revisarEntrega(S,d){
    if(!puedeEn(S,'articulos')) falla('No tienes permiso para confirmar artículos');
    for(const ev of S.eventos) for(const a of (ev.articulos||[])){ const x=(a.movs||[]).find(m=>m.id===d.id); if(x){ x.estado=d.aprobar?'validado':'rechazado'; return; } }
    falla('Entrega no encontrada');
  },
  borrarEntrega(S,d){
    for(const ev of S.eventos) for(const a of (ev.articulos||[])){ const i=(a.movs||[]).findIndex(m=>m.id===d.id);
      if(i>=0){ const x=a.movs[i]; if(!puedeEn(S,'articulos') && !(x.personaId===S.yo.id&&x.estado==='pendiente')) falla('No puedes borrar esta entrega'); a.movs.splice(i,1); return; } }
    falla('Entrega no encontrada');
  },
  guardarPermisos(S,d){
    if(!S.yo.admin) falla('Solo el administrador puede hacer esto');
    const p=persDe(S,d.personaId); if(!p) falla('Persona no encontrada'); if(!p.email) falla('Solo puede ser administrador B alguien con cuenta (correo)');
    const l=(d.permisos||[]).filter(k=>S.catalogoPermisos[k]);
    S.permisos=S.permisos||{}; if(l.length) S.permisos[p.id]=l; else delete S.permisos[p.id];
    if(S.moderador===p.id && !l.includes('avisos')) S.moderador='';
  }
};
function aplicarOp(S, op){
  const fn=REDUCTORES[op.accion]; if(!fn) falla('Acción no disponible sin conexión');
  fn(S, op.datos||{}, op); recomputar(S);
}

/* ---- recalcula cuotas, saldos, avances y pendientes (igual que el servidor) ---- */
function recomputar(S){
  const nom=id=>nombreEn(S,id);
  const activos=S.personas.filter(p=>p.activo).map(p=>p.id);
  S.eventos.forEach(ev=>{
    ev.pagos=ev.pagos||[]; ev.gastos=ev.gastos||[]; ev.fotos=ev.fotos||[]; ev.articulos=ev.articulos||[];
    if(ev.aplicaTodos){ const prev=(ev.participantes||[]).filter(x=>activos.includes(x)); ev.participantes=prev.concat(activos.filter(x=>!prev.includes(x))); }
    const part=ev.participantes||[], n=part.length;
    ev.cuotaPP = ev.modoCuota==='porPersona' ? r2(ev.montoPorPersona) : (ev.modoCuota==='total'&&n ? r2(ev.montoTotal/n) : 0);
    ev.totalEsperado=r2(ev.cuotaPP*n);
    if(persDe(S,ev.creadoPor)) ev.creadorNombre=nom(ev.creadoPor);
    ev.pagos.forEach(m=>m.nombre=nom(m.personaId));
    const ids=part.slice(); ev.pagos.forEach(m=>{ if(!ids.includes(m.personaId)) ids.push(m.personaId); });
    ev.cuentas=ids.map(pid=>{
      const participa=part.includes(pid), cuota=participa?ev.cuotaPP:0, mias=ev.pagos.filter(m=>m.personaId===pid);
      const pagado=sumaM(mias.filter(m=>m.estado==='validado')), revision=sumaM(mias.filter(m=>m.estado==='pendiente'));
      return {personaId:pid,nombre:nom(pid),participa,cuota,pagado,revision,saldo:r2(cuota-pagado)};
    }).sort((a,b)=>a.nombre.localeCompare(b.nombre));
    const fEv=S.fondo.movimientos.filter(f=>f.eventoId===ev.id);
    const rec=sumaM(ev.pagos.filter(m=>m.estado==='validado')), apo=sumaM(fEv.filter(f=>f.tipo==='egreso')), env=sumaM(fEv.filter(f=>f.tipo==='ingreso')), gas=sumaM(ev.gastos);
    ev.finanzas={recaudado:rec,aportesFondo:apo,enviadoFondo:env,gastos:gas,resultado:r2(rec+apo-gas-env)};
    ev.articulos.forEach(a=>{
      a.asignados=a.paraTodos?part.slice():[a.personaId]; a.nombre=a.paraTodos?'Todos':nom(a.personaId);
      a.cantidad=Number(a.cantidad)||0;
      if(a.cantidad>0){
        a.movs=(a.movs||[]).filter(x=>x.estado!=='rechazado' && a.asignados.includes(x.personaId));
        a.movs.forEach(x=>x.nombre=nom(x.personaId)); a.avance={};
        a.asignados.forEach(pid=>{ const mm=a.movs.filter(x=>x.personaId===pid);
          a.avance[pid]={ok:sumaM(mm.filter(x=>x.estado==='validado'),'cantidad'),pend:sumaM(mm.filter(x=>x.estado==='pendiente'),'cantidad')}; });
        a.entregados=a.asignados.filter(pid=>a.avance[pid].ok>=a.cantidad-0.0001);
        a.porConfirmar=a.asignados.filter(pid=>a.avance[pid].pend>0);
      } else {
        a.movs=[]; a.avance={};
        a.entregados=(a.entregados||[]).filter(x=>a.asignados.includes(x));
        a.porConfirmar=(a.porConfirmar||[]).filter(x=>a.asignados.includes(x)&&!a.entregados.includes(x));
      }
    });
  });
  S.eventos.sort((a,b)=>(a.fecha+(a.hora||'')).localeCompare(b.fecha+(b.hora||'')));
  const aprob=S.eventos.filter(e=>e.estado==='aprobado');
  S.personas.forEach(p=>{
    let adeudo=0, exc=0; const det=[];
    aprob.forEach(ev=>{ const c=ev.cuentas.find(x=>x.personaId===p.id); if(!c) return;
      if(c.saldo>0) adeudo+=c.saldo; else exc+=-c.saldo;
      det.push({eventoId:ev.id,titulo:ev.titulo,fecha:ev.fecha,cuota:c.cuota,pagado:c.pagado,revision:c.revision,saldo:c.saldo}); });
    p.movsSaldo=p.movsSaldo||[];
    p.adeudo=r2(adeudo); p.excedente=r2(exc); p.detalle=det;
    p.saldoFavor=sumaM(p.movsSaldo.filter(m=>m.estado==='validado'));
    p.enRevision=r2(S.eventos.reduce((s,ev)=>s+sumaM(ev.pagos.filter(m=>m.personaId===p.id&&m.estado==='pendiente')),0)+sumaM(p.movsSaldo.filter(m=>m.estado==='pendiente')));
  });
  const yoP=persDe(S,S.yo.id); if(yoP) S.yo.nombre=yoP.nombre;
  S.fondo.movimientos.forEach(m=>{ const e=evDe(S,m.eventoId); m.eventoTitulo=e?e.titulo:''; });
  S.fondo.saldo=r2(S.fondo.movimientos.reduce((s,m)=>s+(m.tipo==='ingreso'?1:-1)*(Number(m.monto)||0),0));
  const mod=puedeEn(S,'avisos');
  S.avisos.forEach(a=>{ a.nombre=nom(a.personaId); a.puedeBorrar=mod||a.personaId===S.yo.id; });
  if(S.pendientes){
    const P=S.pendientes;
    P.pagos=[];
    if(puedeEn(S,'validarPagos')){
      S.eventos.forEach(ev=>ev.pagos.filter(m=>m.estado==='pendiente').forEach(m=>P.pagos.push({id:m.id,personaId:m.personaId,nombre:nom(m.personaId),monto:m.monto,eventoId:ev.id,eventoTitulo:ev.titulo,archivoId:m.archivoId,nota:m.nota,fecha:m.fecha})));
      S.personas.forEach(p=>p.movsSaldo.filter(m=>m.estado==='pendiente').forEach(m=>P.pagos.push({id:m.id,personaId:p.id,nombre:p.nombre,monto:m.monto,eventoId:'SALDO',eventoTitulo:'Abono a saldo a favor',archivoId:m.archivoId,nota:m.nota,fecha:m.fecha})));
      P.pagos.sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
    }
    P.propuestas=puedeEn(S,'propuestas')?S.eventos.filter(e=>e.estado==='propuesto').map(e=>e.id):[];
    P.entregas=[];
    if(puedeEn(S,'articulos')) S.eventos.forEach(ev=>ev.articulos.forEach(a=>{
      if(a.cantidad>0) a.movs.filter(m=>m.estado==='pendiente').forEach(m=>P.entregas.push({articuloId:a.id,entregaId:m.id,personaId:m.personaId,nombre:m.nombre,descripcion:a.descripcion,cantidad:m.cantidad,total:a.cantidad,llevaOk:a.avance[m.personaId].ok,eventoId:ev.id,eventoTitulo:ev.titulo,fecha:ev.fecha}));
      else a.porConfirmar.forEach(pid=>P.entregas.push({articuloId:a.id,personaId:pid,nombre:nom(pid),descripcion:a.descripcion,eventoId:ev.id,eventoTitulo:ev.titulo,fecha:ev.fecha}));
    }));
  }
}

/* ---- arma lo que se ve: datos del servidor + cambios pendientes ---- */
function reconstruir(){
  if(!BASE) return;
  const S=clonar(BASE); LOCALES={};
  S.avisos=S.avisos||[]; S.bloqueados=S.bloqueados||[]; S.fondo=S.fondo||{saldo:0,movimientos:[]};
  recomputar(S);
  OUTBOX.forEach(op=>{ try{ aplicarOp(S,op); op.errorLocal=''; }catch(e){ op.errorLocal=e.message; } });
  D=S;
}

/* ---- guardar un cambio (con o sin internet) ---- */
async function escribir(accion, datos){
  if(!BASE) throw new Error('Aún no hay datos en este celular. Conéctate a internet una vez.');
  const op={opId:nid('O'),accion,datos:clonar(datos||{}),t:ahoraLocal()};
  asignarIds(op);
  aplicarOp(clonar(D), op);            // valida con las mismas reglas antes de aceptarlo
  OUTBOX.push(op); await kvSet('outbox',OUTBOX);
  reconstruir(); pintar(); refrescarModales(); pintarEstado();
  _ultOffline=false;
  if(!navigator.onLine){ _ultOffline=true; pintarEstado(); return {offline:true,op}; }
  try{
    const r=await sincronizar();
    const err=(r.errores||[]).find(x=>x.opId===op.opId);
    if(err){ FALLIDOS=FALLIDOS.filter(x=>x.opId!==op.opId); await kvSet('fallidos',FALLIDOS); pintarEstado(); throw new Error(err.error); }
    return {op};
  }catch(e){
    if(e.red){ _ultOffline=true; return {offline:true,op}; }
    throw e;
  }
}

/* ---- enviar pendientes y traer lo nuevo ---- */
let _sync=null;
function sincronizar(){
  if(_sync) return _sync;
  _sync=(async()=>{
    ESTADO_RED='sync'; pintarEstado();
    try{
      const errores=[]; let datosNuevos=null; const huboOps=OUTBOX.length>0;
      const SIZE=3500000;
      while(true){
        const lote=[]; let tam=0;
        for(const op of OUTBOX){ const j=JSON.stringify({opId:op.opId,accion:op.accion,datos:op.datos}).length; if(lote.length && tam+j>SIZE) break; lote.push(op); tam+=j; }
        if(!lote.length){ if(!datosNuevos) datosNuevos=await api('datos'); break; }
        const ultimo=lote.length===OUTBOX.length;
        const r=await api('lote',{ops:lote.map(o=>({opId:o.opId,accion:o.accion,datos:o.datos})),sinDatos:!ultimo});
        const hechos=new Set();
        (r.resultados||[]).forEach(x=>{
          hechos.add(x.opId);
          const op=lote.find(o=>o.opId===x.opId);
          const benigno=op && /^borrar/.test(op.accion) && /no encontrad/i.test(x.error||'');
          if(!x.ok && !benigno && op) errores.push({opId:op.opId,accion:op.accion,datos:resumenDatos(op),t:op.t,error:x.error});
        });
        OUTBOX=OUTBOX.filter(o=>!hechos.has(o.opId));
        await kvSet('outbox',OUTBOX);
        if(r.datos){ datosNuevos=r.datos; if(!OUTBOX.length) break; }
      }
      const cambio=JSON.stringify(datosNuevos)!==JSON.stringify(BASE);
      BASE=datosNuevos;
      if(errores.length) FALLIDOS=FALLIDOS.concat(errores);
      await guardarLocal();
      ULTIMA_SYNC=Date.now(); ls.set('cg_ultima',String(ULTIMA_SYNC));
      ESTADO_RED=OUTBOX.length?'pend':'ok';
      reconstruir(); if(cambio || errores.length || huboOps){ pintar(); refrescarModales(); }
      pintarEstado();
      if(errores.length) toast(errores.length===1?'Un cambio no se pudo guardar. Toca el aviso de arriba.':errores.length+' cambios no se pudieron guardar. Toca el aviso de arriba.',true);
      return {errores};
    }catch(e){
      ESTADO_RED = e.red ? 'offline' : 'error'; pintarEstado();
      throw e;
    }finally{ _sync=null; }
  })();
  return _sync;
}
function sincronizarCallado(){ return sincronizar().catch(()=>{}); }

/* ---- indicador de conexión en el encabezado ---- */
const NOMBRES_OP={guardarEvento:'Evento',revisarEvento:'Revisión de propuesta',borrarEvento:'Borrar evento',registrarPago:'Pago',revisarPago:'Validación de pago',
  borrarPago:'Borrar pago',moverSaldo:'Traspaso de saldo',guardarGasto:'Gasto',borrarGasto:'Borrar gasto',subirFoto:'Foto',borrarFoto:'Borrar foto',
  movimientoFondo:'Movimiento del fondo',borrarFondo:'Borrar movimiento del fondo',guardarPersona:'Persona',guardarConfig:'Datos bancarios',
  actualizarMiNombre:'Mi nombre',borrarPersona:'Eliminar cuenta',desbloquearCorreo:'Desbloquear correo',guardarPersonalizacion:'Personalización',
  publicarAviso:'Aviso',borrarAviso:'Borrar aviso',fijarAviso:'Fijar aviso',guardarArticulo:'Artículo',borrarArticulo:'Quitar artículo',
  marcarEntrega:'Entrega de artículo',confirmarEntrega:'Confirmación de artículo',registrarEntrega:'Entrega parcial',revisarEntrega:'Confirmación de entrega',
  borrarEntrega:'Borrar entrega',guardarPermisos:'Permisos'};
function resumenDatos(op){
  const d=op.datos||{};
  const t=d.titulo||d.descripcion||d.concepto||d.texto||d.nombre||'';
  return (t?String(t).slice(0,50):'')+(d.monto?(t?' · ':'')+fmt(d.monto):'')+(d.cantidad&&op.accion==='registrarEntrega'?' · '+d.cantidad:'');
}
function pintarEstado(){
  const el=$('#estadoRed'); if(!el) return;
  const n=OUTBOX.length, f=FALLIDOS.length;
  let h='';
  if(f) h=`<span class="red-chip err">⚠️ ${f}</span>`;
  if(ESTADO_RED==='sync') h+=`<span class="red-chip">↻ Sincronizando${n?' '+n:''}</span>`;
  else if(!navigator.onLine || ESTADO_RED==='offline') h+=`<span class="red-chip off">📴 Sin conexión${n?' · '+n+' pendiente'+(n>1?'s':''):''}</span>`;
  else if(n) h+=`<span class="red-chip">⏳ ${n} pendiente${n>1?'s':''}</span>`;
  else if(ESTADO_RED==='error') h+=`<span class="red-chip err">⚠️ Sin sincronizar</span>`;
  el.innerHTML=h;
}
function hace(ms){ if(!ms) return 'nunca'; const m=Math.round((Date.now()-ms)/60000); if(m<1) return 'hace un momento'; if(m<60) return 'hace '+m+' min'; const h=Math.round(m/60); if(h<24) return 'hace '+h+' h'; return new Date(ms).toLocaleString('es-MX'); }
function verSincronizacion(){
  const m=abrirModal('Datos en este celular', ()=>{
    const enLinea=navigator.onLine;
    return `<div class="card"><div class="renglon"><span>Conexión</span><b>${enLinea?'🟢 En línea':'📴 Sin conexión'}</b></div>
      <div class="renglon"><span>Última sincronización</span><b>${hace(ULTIMA_SYNC)}</b></div>
      <div class="renglon"><span>Cambios por enviar</span><b>${OUTBOX.length}</b></div></div>
      <div class="aviso">Todo lo que ves está guardado en tu celular. Puedes seguir usando la app sin internet; los cambios se envían solos cuando vuelva la señal.</div>
      ${OUTBOX.length?`<div class="titulo-sec"><span>Pendientes de enviar</span></div><div class="card" style="padding:4px 12px">${OUTBOX.map(o=>`<div class="item">
        <div class="cuerpo"><b>${esc(NOMBRES_OP[o.accion]||o.accion)}</b><div class="sub">${esc(resumenDatos(o))}${resumenDatos(o)?' · ':''}${esc(o.t)}</div>
        ${o.errorLocal?`<div class="sub rojo">${esc(o.errorLocal)}</div>`:''}</div>
        <button class="btn chico gris" onclick="descartarOp('${o.opId}')">Descartar</button></div>`).join('')}</div>`:''}
      ${FALLIDOS.length?`<div class="titulo-sec"><span>No se pudieron guardar</span><button class="btn chico gris" onclick="limpiarFallidos()">Limpiar</button></div>
        <div class="card" style="padding:4px 12px">${FALLIDOS.map(x=>`<div class="item"><div class="cuerpo"><b>${esc(NOMBRES_OP[x.accion]||x.accion)}</b>
        <div class="sub">${esc(x.datos||'')}${x.datos?' · ':''}${esc(x.t||'')}</div><div class="sub rojo">${esc(x.error)}</div></div></div>`).join('')}</div>
        <div class="sub" style="margin:-4px 4px 12px">Otra persona pudo haber cambiado lo mismo antes. Revisa y vuelve a hacerlo si hace falta.</div>`:''}
      <button class="btn full" onclick="sincronizarAhora()" ${enLinea?'':'disabled style="opacity:.5"'}>↻ Sincronizar ahora</button>`;
  });
  m.vivo=true;
}
async function sincronizarAhora(){
  cargando(true);
  try{ await sincronizar(); toast(OUTBOX.length?'Quedan cambios por enviar':'Todo sincronizado ✓'); }
  catch(e){ toast(e.message,true); }
  finally{ cargando(false); }
}
async function descartarOp(opId){
  if(!confirm('¿Descartar este cambio? No se enviará.')) return;
  OUTBOX=OUTBOX.filter(o=>o.opId!==opId); await kvSet('outbox',OUTBOX);
  reconstruir(); pintar(); refrescarModales(); pintarEstado();
}
async function limpiarFallidos(){ FALLIDOS=[]; await kvSet('fallidos',FALLIDOS); refrescarModales(); pintarEstado(); }

/* ---- sincronización automática ---- */
window.addEventListener('online', ()=>{ pintarEstado(); if(TOKEN&&BASE) sincronizarCallado(); });
window.addEventListener('offline', ()=>{ ESTADO_RED='offline'; pintarEstado(); });
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && TOKEN && BASE && navigator.onLine && (OUTBOX.length || Date.now()-ULTIMA_SYNC>60000)) sincronizarCallado();
});
setInterval(()=>{
  if(document.visibilityState!=='visible' || !TOKEN || !BASE || !navigator.onLine) return;
  if(OUTBOX.length || Date.now()-ULTIMA_SYNC>300000) sincronizarCallado();
}, 60000);

iniciar();
</script>
